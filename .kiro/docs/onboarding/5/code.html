<script>
        function toggleDay(checkbox, timeId) {
            const timeContainer = document.getElementById(timeId);
            if (checkbox.checked) {
                timeContainer.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                timeContainer.classList.add('opacity-50', 'pointer-events-none');
            }
        }

        // Add a simple atmospheric mouse trail effect
        document.addEventListener('mousemove', (e) => {
            const bloom = document.createElement('div');
            bloom.style.position = 'fixed';
            bloom.style.left = e.clientX + 'px';
            bloom.style.top = e.clientY + 'px';
            bloom.style.width = '150px';
            bloom.style.height = '150px';
            bloom.style.background = 'radial-gradient(circle, rgba(89, 46, 255, 0.03) 0%, transparent 70%)';
            bloom.style.borderRadius = '50%';
            bloom.style.pointerEvents = 'none';
            bloom.style.transform = 'translate(-50%, -50%)';
            bloom.style.zIndex = '0';
            document.body.appendChild(bloom);
            
            setTimeout(() => {
                bloom.remove();
            }, 1000);
        });
    </script>
