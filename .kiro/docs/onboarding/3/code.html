<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .soft-radial-gradient {
            background: radial-gradient(circle at 50% 50%, rgba(200, 191, 255, 0.2) 0%, rgba(240, 243, 254, 1) 100%);
        }
        .canvas-card {
            border: 1px solid #f0f3fe;
        }
    </style>

<body class="bg-background font-body-md text-on-surface overflow-x-hidden">
<!-- TopNavBar Suppression Check: This is an Onboarding screen, so we exclude the full shared nav to prioritize the canvas -->
<main class="soft-radial-gradient min-h-screen flex flex-col items-center justify-center py-stack-48 px-8">
<!-- Onboarding Container -->
<div class="max-w-[700px] w-full space-y-gap-section">
<!-- Progress Indicator -->
<div class="flex justify-center items-center gap-stack-8 mb-stack-24">
<div class="h-2 w-12 rounded-full bg-primary-container"></div>
<div class="h-2 w-12 rounded-full bg-primary-container"></div>
<div class="h-2 w-12 rounded-full bg-primary-container"></div>
<div class="h-2 w-12 rounded-full bg-primary-container ring-4 ring-primary-fixed"></div>
<div class="h-2 w-12 rounded-full bg-surface-container-high"></div>
</div>
<!-- Header Section -->
<div class="text-center space-y-stack-16">
<h1 class="font-display-sm text-display-sm text-primary tracking-tight">Přidejte první službu</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[600px] mx-auto">
                    Stačí jedna služba. Další můžete přidat hned teď nebo později v dashboardu.
                </p>
</div>
<!-- Profile Form Card -->
<div class="bg-canvas-white rounded-[26px] p-padding-card canvas-card shadow-sm transition-all duration-300">
<form class="grid grid-cols-1 md:grid-cols-2 gap-stack-24">
<!-- Full Width Field -->
<div class="col-span-full space-y-stack-8">
<label class="font-caption text-caption text-on-surface-variant uppercase tracking-wider">Název služby</label>
<input class="w-full bg-canvas-white border-input-border border-2 rounded-[12px] px-padding-input-h py-padding-input-v focus:ring-2 focus:ring-primary focus:outline-none transition-all" id="service_name" placeholder="Např. Individuální trénink" type="text"/>
</div>
<!-- Split Fields -->
<div class="space-y-stack-8">
<label class="font-caption text-caption text-on-surface-variant uppercase tracking-wider">Délka</label>
<div class="relative">
<select class="w-full bg-canvas-white border-input-border border-2 rounded-[12px] px-padding-input-h py-padding-input-v focus:ring-2 focus:ring-primary focus:outline-none transition-all appearance-none" id="duration">
<option value="15">15 minut</option>
<option value="30">30 minut</option>
<option value="45">45 minut</option>
<option selected="" value="60">60 minut</option>
<option value="90">90 minut</option>
<option value="120">120 minut</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<div class="space-y-stack-8">
<label class="font-caption text-caption text-on-surface-variant uppercase tracking-wider">Cena (CZK)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">payments</span>
<input class="w-full bg-canvas-white border-input-border border-2 rounded-[12px] pl-10 pr-padding-input-h py-padding-input-v focus:ring-2 focus:ring-primary focus:outline-none transition-all" id="price" placeholder="0" type="number"/>
</div>
</div>
<!-- Full Width Area -->
<div class="col-span-full space-y-stack-8">
<label class="font-caption text-caption text-on-surface-variant uppercase tracking-wider">Popis</label>
<textarea class="w-full bg-canvas-white border-input-border border-2 rounded-[12px] px-padding-input-h py-padding-input-v focus:ring-2 focus:ring-primary focus:outline-none transition-all resize-none" id="description" placeholder="Stručně popište, co klient od této služby může očekávat..." rows="3"></textarea>
</div>
</form>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row items-center justify-between gap-stack-16 pt-stack-24">
<button class="group flex items-center gap-stack-8 px-stack-24 py-stack-16 rounded-[12px] border-2 border-cloud-mist text-secondary font-headline-sm hover:bg-cloud-mist transition-all duration-200" type="button">
<span class="material-symbols-outlined transition-transform group-hover:-translate-x-1">arrow_back</span>
                    Zpět
                </button>
<button class="w-full sm:w-auto flex items-center justify-center gap-stack-8 px-12 py-stack-16 rounded-[12px] bg-primary text-canvas-white font-headline-sm hover:opacity-90 active:scale-95 transition-all duration-200 shadow-lg shadow-primary/20" type="submit">
                    Pokračovat
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
<!-- Decorative Elements -->
<div class="fixed bottom-0 left-0 w-full h-1/3 opacity-30 pointer-events-none -z-10 bg-gradient-to-t from-air-blue to-transparent"></div>
<div class="fixed -top-20 -right-20 w-64 h-64 rounded-full bg-sunset-pink blur-3xl opacity-20 -z-10"></div>
<div class="fixed top-1/3 -left-32 w-80 h-80 rounded-full bg-lush-green blur-3xl opacity-20 -z-10"></div>
</main>
<!-- Footer Suppression Check: Onboarding screens typically minimize footer navigation -->
<footer class="w-full py-stack-48 bg-cloud-mist flex flex-col items-center gap-stack-24 border-t border-soft-gray">
<p class="font-body-sm text-body-sm text-on-surface-variant">© 2024 Horea SaaS. Všechna práva vyhrazená.</p>
<div class="flex gap-stack-24">
<a class="text-on-surface-variant hover:text-primary transition-colors text-body-sm" href="#">Podmínky</a>
<a class="text-on-surface-variant hover:text-primary transition-colors text-body-sm" href="#">Ochrana údajů</a>
<a class="text-on-surface-variant hover:text-primary transition-colors text-body-sm" href="#">Podpora</a>
</div>
</footer>
<script>
        // Micro-interactions for form inputs
        document.querySelectorAll('input, select, textarea').forEach(element => {
            element.addEventListener('focus', () => {
                element.parentElement.querySelector('label')?.classList.add('text-primary');
            });
            element.addEventListener('blur', () => {
                element.parentElement.querySelector('label')?.classList.remove('text-primary');
            });
        });

        // Form submission prevention for demo
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            console.log('Navigating to step 5...');
        });
    </script>
</body></html>
