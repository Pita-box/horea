<body class="font-body-md text-on-surface flex flex-col items-center justify-center p-6">
<div class="max-w-xl w-full flex flex-col gap-gap-section">
<!-- Progress Bar -->
<div class="flex items-center gap-stack-8 px-4">
<div class="h-1.5 flex-1 bg-primary rounded-full"></div>
<div class="h-1.5 flex-1 bg-primary rounded-full"></div>
<div class="h-1.5 flex-1 bg-cloud-mist rounded-full"></div>
<div class="h-1.5 flex-1 bg-cloud-mist rounded-full"></div>
</div>
<!-- Main Content Card -->
<main class="canvas-card p-padding-card flex flex-col gap-stack-24 transition-all duration-300 rounded-[26px]">
<div class="flex flex-col gap-stack-8 text-center sm:text-left">
<h1 class="font-display-sm text-display-sm text-primary tracking-tight text-center">Jak se jmenuje váš podnik?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[600px] mx-auto text-center">Vyplňte název vašeho podniku, ze kterého po aktivaci účtu vytvoříme vaši unikátní rezervační stránku.</p>
</div>
<div class="flex flex-col gap-stack-16">
<div class="flex flex-col gap-stack-4">
<label class="font-caption text-caption text-on-surface-variant uppercase tracking-wider" for="business_name">Název podniku</label>
<div class="relative group">
<input class="w-full bg-canvas-white border-input-border border-2 rounded-[12px] px-padding-input-h py-padding-input-v focus:ring-2 focus:ring-primary focus:outline-none transition-all text-body-md font-body-md" id="business_name" placeholder="Zadejte název..." type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-primary opacity-0 group-focus-within:opacity-100 transition-opacity">
<span class="material-symbols-outlined">storefront</span>
</div>
</div>
</div>
<!-- Live Preview Block -->
<div class="bg-cloud-mist p-padding-input-v rounded-xl border border-dashed border-outline-variant flex items-center justify-between overflow-hidden">
<div class="flex items-center gap-stack-8">
<span class="material-symbols-outlined text-secondary text-lg">language</span>
<div class="flex items-baseline gap-1">
<span class="font-caption text-caption text-on-surface-variant">horea.cz/</span>
<span class="font-body-md text-body-md text-primary font-bold" id="url_preview">vas-nazev</span>
</div>
</div>
<span class="font-caption text-caption text-outline uppercase tracking-wider text-[10px]">Preview</span>
</div>
</div>
<!-- Footer Actions -->
<div class="flex flex-col sm:flex-row items-center gap-stack-16 pt-stack-16">
<button class="group flex items-center gap-stack-8 px-stack-24 py-stack-16 rounded-[12px] border-2 border-cloud-mist text-secondary font-headline-sm hover:bg-cloud-mist transition-all duration-200" type="button"><span class="material-symbols-outlined transition-transform group-hover:-translate-x-1">arrow_back</span>Zpět</button>
<button class="w-full sm:w-auto flex items-center justify-center gap-stack-8 px-12 py-stack-16 rounded-[12px] bg-primary text-canvas-white font-headline-sm hover:opacity-90 active:scale-95 transition-all duration-200 shadow-lg shadow-primary/20" type="submit">Pokračovat<span class="material-symbols-outlined">arrow_forward</span></button>
</div>
</main>
<!-- Illustration / Mood Section -->
<section class="hidden md:flex items-center justify-center gap-stack-48 px-padding-card">
<div class="flex-1 h-px bg-cloud-mist"></div>
<div class="flex gap-stack-16">
<div class="w-10 h-10 rounded-full bg-air-blue/30 flex items-center justify-center text-primary">

</div>
<div class="w-10 h-10 rounded-full bg-sunset-pink/30 flex items-center justify-center text-tertiary">

</div>

</div>

<footer class="text-center">
<span class="font-display-sm text-[24px] font-bold text-primary opacity-40">Horea</span>
</footer>
</div>
<!-- Micro-interactions Script -->
<script>
        const input = document.getElementById('business_name');
        const preview = document.getElementById('url_preview');

        input.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val.trim() === '') {
                preview.textContent = 'vas-nazev';
                preview.classList.remove('text-primary');
                preview.classList.add('text-outline');
            } else {
                // Slugify text for preview
                const slug = val
                    .toLowerCase()
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .replace(/[^a-z0-9]/g, '-')
                    .replace(/-+/g, '-')
                    .replace(/^-|-$/g, '');
                
                preview.textContent = slug || '...';
                preview.classList.add('text-primary');
                preview.classList.remove('text-outline');
            }
        });

        // Simple enter key handling
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.querySelector('button.bg-primary').click();
            }
        });
    </script>
